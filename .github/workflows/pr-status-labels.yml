name: PR Status Labels

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  check_run:
    types: [completed]
  status: {}

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr-status-labels-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.check_run.head_sha || github.event.check_suite.head_sha || github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  synchronize-labels:
    if: ${{ github.event_name != 'check_run' || github.event.check_run.name != 'synchronize-labels' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Recalculate PR status labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 .github/scripts/sync-pr-status-labels.py
